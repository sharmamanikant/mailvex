limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# Docker's embedded DNS. Upstream names in an `upstream` block resolve once at
# startup, so a recreated backend/frontend would keep a stale address and return
# 502 until nginx restarted. A variable in proxy_pass defers resolution to
# request time.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;

# Restore the real client IP. Cloudflare Tunnel terminates on the host, so the
# only peer nginx sees is 127.0.0.1. Without these directives every request is
# attributed to 127.0.0.1 and the rate-limit zone becomes a global 20r/s cap for
# all users combined.
include /etc/nginx/snippets/cloudflare-realip.conf;

upstream crcrm_backend {
    server backend:8000;
}

upstream crcrm_frontend {
    server frontend:80;
}

# Origin server. TLS is terminated by Cloudflare in front of the tunnel, and the
# cloudflared-to-origin hop is loopback on the host, so this listener is plain
# HTTP and is published to 127.0.0.1 only. It is never reachable from the LAN.
server {
    listen 8080;
    server_name _;

    client_max_body_size 20M;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Answered by nginx itself with no upstream involvement, so the container
    # healthcheck reports on the edge rather than on its dependencies.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location /health {
        set $health_backend http://backend:8000;
        proxy_pass $health_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
