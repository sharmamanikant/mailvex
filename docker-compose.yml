# CR+CRM - single production Compose definition.
#
# Runs on the Ubuntu host at 192.168.0.13. Cloudflare Tunnel is installed on the
# host (NOT in a container) and is the only ingress: it forwards
# https://mailvex.in to http://127.0.0.1:8080, which is the nginx origin below.
#
# Consequences of that topology, all deliberate:
#   - PostgreSQL is on the private database host configured by POSTGRES_HOST;
#     Redis is reachable only on the internal Docker network.
#   - The single published port is bound to 127.0.0.1, so nginx is unreachable
#     from other machines on 192.168.0.0/24.
#   - TLS terminates at Cloudflare. nginx speaks plain HTTP on loopback.
#
# Usage:
#   cp .env.production.example .env.production   # then replace placeholders
#   docker compose --env-file .env.production build
#   docker compose --env-file .env.production up -d
#
# RUNTIME_ENV_FILE is required and is supplied by the env file itself.

name: crcrm

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # A password is required, not optional. With protected mode on and no
      # password Redis answers every non-loopback client with
      # "-DENIED Redis is running in protected mode", which surfaces as an
      # opaque 429 on every rate-limited route because the limiter fails
      # closed in production. No port is published either, so this is
      # defence in depth for a container-only network.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment file}
    # noeviction, not allkeys-lru. Redis holds three classes of data here:
    #   - the Celery broker (queued send jobs)
    #   - the Celery result backend
    #   - rate-limit counters, warmup advisory locks, sender daily quotas
    # Evicting a key means losing queued send work or resetting a quota counter,
    # both of which fail silently while the campaign still reports as queued.
    # noeviction makes a full instance fail loudly (503) instead.
    #
    # maxmemory is set below the container limit on purpose: Redis starts
    # returning OOM errors at REDIS_MAXMEMORY while it still has headroom to
    # serve reads and release memory, rather than being OOM-killed by the kernel
    # and restart-looping. Keep REDIS_MAXMEMORY below the memory limit below.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      # Plain `redis-cli ping` returns NOAUTH once a password is set.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [crcrm-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: "${REDIS_MEMORY_LIMIT:-256M}" }

  # One-shot schema migration. backend/worker/scheduler wait for it to exit 0,
  # so the application never starts against a stale schema.
  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: "no"
    user: "10001:10001"
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE in the environment file}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    # Bootstraps an empty database from the models and stamps it at head, then
    # upgrades normally. The initial revision builds the schema from live model
    # metadata, so a fresh database cannot be built by replaying the chain;
    # see backend/app/db_bootstrap.py.
    command: ["python", "-m", "app.db_bootstrap"]
    depends_on:
      redis:
        condition: service_healthy
    networks: [crcrm-net]

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE in the environment file}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "${UVICORN_WORKERS:-2}",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - uploads_data:/app/.local_uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [crcrm-net]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE in the environment file}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    command: ["celery", "-A", "app.tasks.scheduler", "worker",
              "--loglevel=info", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    volumes:
      - uploads_data:/app/.local_uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [crcrm-net]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  scheduler:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE in the environment file}
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    # Run exactly one scheduler. Additional beat instances duplicate every
    # periodic task (rule seeding, stale-import reclaim, delivery dispatch).
    command: ["celery", "-A", "app.tasks.scheduler", "beat", "--loglevel=info"]
    volumes:
      - uploads_data:/app/.local_uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [crcrm-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        APP_BUILD_REV: ${APP_BUILD_REV:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [crcrm-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      # Loopback only. Cloudflare Tunnel on the host is the sole client.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [crcrm-net]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }

  backup:
    build:
      context: .
      dockerfile: infrastructure/backup/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in the environment file}
      PGPORT: 5432
      PGUSER: ${BACKUP_PGUSER:?Set BACKUP_PGUSER in the environment file}
      PGPASSWORD: ${BACKUP_PGPASSWORD:?Set BACKUP_PGPASSWORD in the environment file}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in the environment file}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      DB_RETENTION_DAYS: ${DB_RETENTION_DAYS:-14}
      FILES_RETENTION_DAYS: ${FILES_RETENTION_DAYS:-30}
      CONFIG_RETENTION_DAYS: ${CONFIG_RETENTION_DAYS:-30}
      REDIS_HOST: redis
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/.local_uploads}
      # backup.sh copies CONFIG_FILE into each dump.
      CONFIG_FILE: /run/config/runtime.env
    command: ["sh", "-c", "while true; do sh /scripts/backup.sh; sleep ${BACKUP_INTERVAL_SECONDS:-3600}; done"]
    volumes:
      # Same volume the API and worker write uploads into, so import CSVs and
      # error reports are captured rather than an empty directory.
        - uploads_data:/app/.local_uploads:ro
        # A named volume, not a host bind mount. The container runs as root, so
        # a bind mount would leave root-owned files on the host that the deploy
        # user cannot delete or replace. Read backups out with:
        #   docker compose --env-file .env.production cp backup:/backups/<file> ./
        - backups_data:/backups
        - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE in the environment file}:/run/config/runtime.env:ro
    networks: [crcrm-net]

  # One-shot disaster recovery. Deliberately NOT the `backup` service: that one
  # mounts uploads_data read-only so a compromised or buggy backup job can never
  # mutate live files. Restoring needs write access, so it gets its own service
  # that exists only under the `restore` profile.
  #
  #   docker compose --profile restore --env-file .env.production \\
  #     run --rm restore
  restore:
    build:
      context: .
      dockerfile: infrastructure/backup/Dockerfile
    profiles: ["restore"]
    restart: "no"
    environment:
      PGHOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in the environment file}
      PGPORT: 5432
      PGUSER: ${BACKUP_PGUSER:?Set BACKUP_PGUSER in the environment file}
      PGPASSWORD: ${BACKUP_PGPASSWORD:?Set BACKUP_PGPASSWORD in the environment file}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in the environment file}
      APP_PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment file}
      APP_PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment file}
      BACKUP_DIR: /backups
      STORAGE_DEST: /app/.local_uploads
      CONFIG_FILE: /run/config/runtime.env
    volumes:
      # Read-write: this is the one place that legitimately writes the filestore.
      - uploads_data:/app/.local_uploads
      - backups_data:/backups:ro
      - ${RUNTIME_ENV_FILE:?Set RUNTIME_ENV_FILE in the environment file}:/run/config/runtime.env:ro
    networks: [crcrm-net]

volumes:
  redis_data:
  # Uploaded import CSVs and error reports. Shared by backend/worker/scheduler
  # so files survive a container recreate, and read by backup for capture.
  uploads_data:
  # Database dumps, filestore snapshots and the captured runtime config.
  backups_data:

networks:
  crcrm-net:
    driver: bridge
